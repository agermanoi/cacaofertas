name: Vídeo de análise (teste)

# Gera o vídeo "Vale a pena comprar?" narrado de um produto e deixa como arquivo da execução.
# Não posta em lugar nenhum.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Produto (slug)"
        required: true
        default: "iphone-17-pro-256gb"
      voice:
        description: "Voz (pt-BR-AntonioNeural, pt-BR-FranciscaNeural, pt-BR-ThalitaMultilingualNeural)"
        required: false
        default: "pt-BR-AntonioNeural"

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium, ffmpeg e voz
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg || sudo apt-get install -y ffmpeg
          pip install --quiet edge-tts
      - name: Gerar vídeo
        run: npm run review-video -- "${{ github.event.inputs.slug }}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: https://cacaofertas.com.br
          TTS_VOICE: ${{ github.event.inputs.voice }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-video
          path: out/review-*.mp4
          if-no-files-found: ignore
          retention-days: 14
