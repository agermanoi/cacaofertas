name: Vídeo para o TikTok

on:
  schedule:
    # de hora em hora, das 09:40 às 23:40 (Brasília): pega os posts publicados nas últimas 3 h
    - cron: "40 12-23,0-2 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Produto (slug) para um vídeo avulso. Vazio = posts pendentes"
        required: false
        default: ""
      send:
        description: "Mandar como rascunho para o TikTok"
        type: boolean
        default: true

concurrency:
  group: video
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SITE_URL: https://cacaofertas.com.br
      SLUG: ${{ github.event.inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tem post esperando vídeo?
        id: check
        run: |
          if [ -n "$SLUG" ]; then echo "pending=1" >> "$GITHUB_OUTPUT"; else npm run -s video -- --pending --check; fi
      - name: Instalar Chromium e ffmpeg
        if: steps.check.outputs.pending != '0'
        run: |
          npx playwright install --with-deps chromium
          command -v ffmpeg || sudo apt-get install -y ffmpeg
      - name: Gerar e enviar
        if: steps.check.outputs.pending != '0'
        run: |
          if [ -n "$SLUG" ]; then
            npm run video -- "$SLUG" ${{ github.event.inputs.send == 'false' && '--no-send' || '' }}
          else
            npm run video -- --pending
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.pending != '0'
        with:
          name: video
          path: out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
