name: Coleta de preços

on:
  schedule:
    # 09:17 e 21:17 (horário de Brasília). Perto da Black Friday dá para apertar.
    - cron: "17 12 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs separados por espaço (vazio = todos)"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Coletar
        run: npm run collect -- ${{ github.event.inputs.slugs }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_TEMPLATE: ${{ secrets.ML_AFFILIATE_TEMPLATE }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LOMADEE_API_KEY: ${{ secrets.LOMADEE_API_KEY }}
          LOMADEE_MDASC: ${{ secrets.LOMADEE_MDASC }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
          AFFILIATE_TEMPLATES: ${{ secrets.AFFILIATE_TEMPLATES }}
          SCRAPER_ENABLED: ${{ vars.SCRAPER_ENABLED || 'true' }}
      - name: Revalidar o site
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_URL" ]; then
            curl -fsS -X POST "$REVALIDATE_URL" -H "authorization: Bearer $REVALIDATE_SECRET"
          else
            echo "REVALIDATE_URL não configurado; o site atualiza sozinho em até 1h."
          fi
